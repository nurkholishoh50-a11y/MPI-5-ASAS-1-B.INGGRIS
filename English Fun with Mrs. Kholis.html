<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>English Fun with Mrs. Kholis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Konsep: kuis petualangan 6 station bersama maskot burung hantu Ollie. Satu kartu soal di tengah, gambar buah, peta jalan Bara, dan alat dapur digambar sendiri. Tema ungu cerah dengan aksen emas. */
:root{
  --blue:#6D4AFF; --blue-deep:#4527C9; --blue-soft:#ECE6FF;
  --sun:#FFC933; --sun-deep:#C98F00; --sun-soft:#FFF0B8;
  --coral:#FF6B5E; --coral-soft:#FFE6E2; --coral-deep:#C73E32;
  --mint:#3FAE49; --mint-soft:#E0F6D8;
  --ink:#1E1B3A; --muted:#5F5A85; --paper:#F8F5FF; --card:#FFFFFF; --line:#DDD5F5;
  --font-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:17px; line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px; margin:0;
  background-image:radial-gradient(circle at 10% 15%,rgba(255,201,51,.22) 0 80px,transparent 81px),radial-gradient(circle at 93% 62%,rgba(109,74,255,.13) 0 130px,transparent 131px),radial-gradient(circle at 70% 94%,rgba(255,107,94,.14) 0 70px,transparent 71px);
  background-attachment:fixed;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--blue-deep)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));background:linear-gradient(180deg,var(--blue) 0,var(--blue-deep) 100%);color:#fff;box-shadow:0 4px 0 var(--sun)}
.top-in{max-width:760px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.12rem;display:flex;align-items:center;gap:8px;margin-right:auto}
.score{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:999px;font-weight:800;font-variant-numeric:tabular-nums}
.tgl{border:2px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85rem;min-height:36px}
.tgl[aria-pressed="true"]{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.prog{flex-basis:100%;height:12px;background:rgba(0,0,0,.25);border-radius:999px;overflow:hidden}
.prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),#FFE17A);border-radius:999px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
main{padding-top:20px}

/* pecahan */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.1;margin:0 3px;font-weight:800}
.fr i{font-style:normal;padding:0 3px}
.fr i:first-child{border-bottom:2px solid currentColor}

/* splash */
.splash{text-align:center;padding:26px 10px 10px}
.splash h1{font-size:clamp(2rem,8vw,3.2rem);font-weight:700}
.splash h1 em{font-style:normal;color:var(--blue);background:linear-gradient(transparent 62%,var(--sun) 62%)}
.splash p{margin:8px auto 18px;max-width:40ch;color:var(--muted);font-weight:700}
.splash .tiny{font-size:.9rem;margin-top:14px}
.splash-m{display:flex;justify-content:center}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* home */
.hero{background:linear-gradient(160deg,var(--blue) 0,var(--blue-deep) 100%);color:#fff;border-radius:28px;padding:24px 22px 26px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;box-shadow:0 8px 0 var(--sun-deep)}
.hero h1{font-size:clamp(1.7rem,6vw,2.5rem);font-weight:700}
.hero h1 em{font-style:normal;color:var(--sun)}
.hero p{margin:8px 0 0}
.ops{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.ops span{width:50px;height:50px;border-radius:16px;background:#fff;color:var(--blue);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:1.6rem;box-shadow:0 4px 0 rgba(0,0,0,.18);animation:bob 2.6s ease-in-out infinite}
.ops span:nth-child(2n){background:var(--sun);color:var(--ink);animation-delay:.3s}
.ops span:nth-child(3n){background:var(--coral);color:#fff;animation-delay:.6s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.panel{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px;margin-top:20px}
.panel h2{font-size:1.25rem;margin-bottom:10px}
label.f{display:block;font-weight:800;margin-bottom:6px}
.inp{width:100%;font:inherit;padding:12px 14px;border:3px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);min-height:48px}
.inp:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 4px var(--blue-soft)}
textarea.inp{min-height:120px;resize:vertical}
.btn{border:0;border-radius:18px;padding:13px 24px;font-family:var(--font-display);font-weight:600;font-size:1.1rem;min-height:50px;transition:transform .15s,box-shadow .15s}
.btn-gold{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-deep)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--sun-deep)}
.btn-gold:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sun-deep)}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-deep)}
.btn-blue:hover{transform:translateY(-2px)}
.btn-blue:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-deep)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn-line{background:#fff;border:3px solid var(--line);color:var(--ink)}
.big-btn{font-size:1.4rem;padding:16px 34px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:10px}
.stg{text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;transition:transform .15s,border-color .15s}
.stg:hover{transform:translateY(-3px);border-color:var(--blue)}
.stg b{font-family:var(--font-display);font-size:1.02rem}
.stg small{color:var(--muted);font-weight:600}

/* soal */
.qhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.badge{background:var(--sun);color:var(--ink);font-family:var(--font-display);font-weight:600;border-radius:999px;padding:5px 14px;font-size:.95rem}
.qno{font-weight:800;color:var(--blue-deep);font-variant-numeric:tabular-nums}
.card{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:22px 20px;box-shadow:0 6px 0 var(--line);animation:rise .4s ease both}
.ctx{background:var(--sun-soft);border-left:8px solid var(--sun);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-weight:600}
.pic{display:flex;justify-content:center;margin:0 0 14px}
.pic svg{max-width:100%;height:auto;border-radius:20px}
.tblw{overflow-x:auto;margin:0 0 14px}
.tbl{border-collapse:separate;border-spacing:0;width:100%;max-width:420px;margin:0 auto;border:3px solid var(--blue);border-radius:16px;overflow:hidden;font-weight:700}
.tbl th{background:var(--blue);color:#fff;font-family:var(--font-display);padding:8px 12px;text-align:left}
.tbl td{padding:8px 12px;border-top:2px solid var(--line);background:#fff;font-variant-numeric:tabular-nums}
.tbl tr:nth-child(even) td{background:var(--blue-soft)}
.qtext{font-size:1.25rem;font-weight:600;margin-bottom:16px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:3px solid var(--line);border-radius:18px;padding:11px 14px;min-height:54px;font-weight:700;transition:transform .15s,border-color .15s,background .15s;overflow-wrap:anywhere}
.opt:hover:not([disabled]){transform:translateY(-2px) scale(1.01);border-color:var(--blue)}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:700}
.opt .t{padding-top:3px}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{background:var(--mint-soft);border-color:var(--mint);box-shadow:0 0 0 4px rgba(63,174,73,.28);animation:pop .5s ease}
.opt.ok .l{background:var(--mint)}
.opt.no{background:var(--coral-soft);border-color:var(--coral);border-style:dashed}
.opt.no .l{background:var(--coral)}
.opt.ok .t::after{content:" ✓ benar";color:var(--mint);font-weight:800}
.opt.no .t::after{content:" ✗ belum tepat";color:var(--coral-deep);font-weight:800}
.opt[disabled]{cursor:default}
.bs{grid-template-columns:1fr 1fr}
.bs .opt{justify-content:center;align-items:center;font-family:var(--font-display);font-size:1.3rem;min-height:68px}
.hint{color:var(--muted);font-weight:700;margin:0 0 10px}

/* jodoh */
.rows{display:grid;gap:8px;margin-bottom:14px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:8px;align-items:stretch}
.mleft{background:var(--blue);color:#fff;border-radius:14px;padding:10px 12px;font-weight:800;display:flex;align-items:center;overflow-wrap:anywhere}
.mslot{background:#fff;border:3px dashed var(--line);border-radius:14px;padding:8px 10px;text-align:left;font-weight:700;min-height:48px;color:var(--muted);overflow-wrap:anywhere}
.mslot.act{border-color:var(--sun);background:var(--sun-soft);color:var(--ink)}
.mslot.fill{border-style:solid;border-color:var(--blue);color:var(--ink);background:var(--blue-soft)}
.mslot.ok{border-style:solid;border-color:var(--mint);background:var(--mint-soft);color:var(--ink)}
.mslot.no{border-style:solid;border-color:var(--coral);background:var(--coral-soft);color:var(--ink)}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.chip{background:#fff;border:3px solid var(--line);border-radius:14px;padding:9px 12px;text-align:left;font-weight:800;display:flex;gap:10px;align-items:center;overflow-wrap:anywhere}
.chip b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-family:var(--font-display)}
.chip:hover:not([disabled]){border-color:var(--blue);transform:translateY(-2px)}
.chip[disabled]{opacity:.4}
.actions{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cnt{font-weight:800;color:var(--blue-deep)}
.chk{display:grid;gap:8px;margin:12px 0}
.chk label{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--blue);margin-top:2px}
.key{background:var(--sun-soft);border-radius:16px;padding:12px 14px;margin:12px 0;font-weight:600}

/* umpan balik */
.fb{margin-top:18px;background:#fff;border:3px solid var(--mint);border-radius:26px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:start;animation:rise .4s ease both;box-shadow:0 6px 0 #2C8736}
.fb.hug{border-color:var(--coral);box-shadow:0 6px 0 var(--coral-deep)}
.bubble h3{font-size:1.3rem;color:var(--mint)}
.fb.hug .bubble h3{color:var(--coral-deep)}
.bubble p{margin:4px 0 0}
.chipscore{display:inline-block;background:var(--sun);color:var(--ink);font-weight:800;border-radius:999px;padding:2px 12px;margin-top:6px}
.exp{grid-column:1/-1;background:var(--paper);border-radius:16px;padding:12px 14px}
.exp b{color:var(--blue-deep)}
.fb .btn{grid-column:1/-1;justify-self:end}
.intro{text-align:center;padding:28px 20px}
.intro h2{font-size:1.7rem;margin:8px 0}
.intro p{max-width:46ch;margin:6px auto 18px}
.res{text-align:center}
.big{font-family:var(--font-display);font-weight:700;font-size:4.2rem;line-height:1;color:var(--blue);font-variant-numeric:tabular-nums}
.big small{font-size:1.4rem;color:var(--muted)}
.bars{display:grid;gap:10px;text-align:left;margin:18px 0}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-weight:800}
.bar i{grid-column:1/-1;display:block;height:14px;border-radius:999px;background:var(--blue-soft);overflow:hidden}
.bar i b{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--mint));border-radius:999px;width:0;transition:width 1s ease}

/* maskot */
.mascot{display:block;overflow:visible}
.mascot .eh,.mascot .brows,.mascot .beak-open{display:none}
.mood-happy .en,.mood-hug .eh{display:none}
.mood-happy .eh,.mood-happy .beak-open{display:block}
.mood-hug .brows{display:block}
.mood-happy{animation:hop .6s ease 3}
.mood-hug{animation:sway 1.3s ease-in-out 2;transform-origin:50% 90%}
.mood-idle{animation:float 3s ease-in-out infinite}
.mood-happy .wL{transform-origin:52px 130px;animation:flapL .3s ease 6}
.mood-happy .wR{transform-origin:148px 130px;animation:flapR .3s ease 6}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) rotate(-3deg)}70%{transform:translateY(0) rotate(3deg)}}
@keyframes sway{0%,100%{transform:rotate(0)}30%{transform:rotate(-6deg)}70%{transform:rotate(6deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes flapL{50%{transform:rotate(-24deg)}}
@keyframes flapR{50%{transform:rotate(24deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (max-width:520px){
  body{font-size:16px}
  .hero{grid-template-columns:1fr;text-align:center;justify-items:center}
  .ops{justify-content:center}
  .mrow{grid-template-columns:1fr}
  .fb{grid-template-columns:1fr;justify-items:center;text-align:center}
  .fb .btn{justify-self:stretch}
  .exp{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<div class="top"><div class="top-in">
  <div class="brand" id="brand"></div>
  <div class="score" id="score" aria-live="polite"></div>
  <button class="tgl" id="tSound" aria-pressed="true" type="button">Efek suara: nyala</button>
  <button class="tgl" id="tVoice" aria-pressed="true" type="button">Suara ucapan: nyala</button>
  <div class="prog" role="progressbar" aria-label="Kemajuan kuis" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progWrap"><i id="prog"></i></div>
</div></div>
<div class="wrap"><main id="app"></main></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
"use strict";
/* ===================== DATA SOAL ===================== */
const STAGES={
  A:{id:'A',pos:'Station 1',name:'Multiple Choice',from:1,to:20,help:'Read the text and look at the picture. Then choose the best answer. (Pilih satu jawaban yang paling tepat.)'},
  B:{id:'B',pos:'Station 2',name:'True or False',from:21,to:25,help:'Read the information. Is the statement True or False? (Tentukan pernyataan itu Benar atau Salah.)'},
  C:{id:'C',pos:'Station 3',name:'Matching',from:26,to:30,help:'Tap an item on the left, then tap the answer that matches. One choice is not used. (Ada satu pilihan yang tidak terpakai.)'},
  D:{id:'D',pos:'Station 4',name:'Choose 3 Answers',from:31,to:35,help:'Choose exactly three correct answers from six choices. (Pilih tepat 3 jawaban yang benar.)'},
  E:{id:'E',pos:'Station 5',name:'Fill in the Blanks',from:36,to:45,help:'Type one short and correct answer in the box. (Ketik jawaban singkat.)'},
  F:{id:'F',pos:'Station 6',name:'Essay',from:46,to:50,help:'Write your answer on paper or in the box. Then compare it with the key and tick the parts you wrote correctly. (Centang bagian yang sudah benar.)'}
};
const Q=[];
const pg=(n,q,o,k,e,x)=>Q.push(Object.assign({n,t:'pg',st:'A',q,o,k,e,max:1},x||{}));
const bs=(n,q,k,e,x)=>Q.push(Object.assign({n,t:'bs',st:'B',q,o:['True','False'],k:k?0:1,e,max:1},x||{}));
const mt=(n,q,rows,ch,key,e,x)=>Q.push(Object.assign({n,t:'mt',st:'C',q,rows,ch,key,e,max:3},x||{}));
const pk=(n,q,o,key,e,x)=>Q.push(Object.assign({n,t:'pk',st:'D',q,o,key,e,max:3},x||{}));
const fi=(n,q,ok,model,e,x)=>Q.push(Object.assign({n,t:'fi',st:'E',q,ok,model,e,max:2},x||{}));
const ur=(n,q,pts,model,x)=>Q.push(Object.assign({n,t:'ur',st:'F',q,pts,model,max:5},x||{}));

const SALAD=`How to Make Fruit Salad. Ingredients: two apples, one banana, one orange, some milk, and some sugar. First, wash the fruits. Second, cut the fruits into small pieces with a knife. Third, put the pieces into a bowl. Then, pour the milk and add some sugar. Next, mix everything with a spoon. Finally, put the salad in the fridge for ten minutes and serve it.`;
const PRICE={head:['Product','Price'],rows:[['Mangoes','Rp 20,000 per kilo'],['Oranges','Rp 15,000 per kilo'],['Grapes','Rp 40,000 per kilo'],['Spinach','Rp 3,000 per bunch']]};
const MAPC=`Look at the map of Bara's street!`;

/* ---- Station 1: multiple choice ---- */
pg(1,'What fruit is in the picture?',['apple','grapes','banana','orange'],2,'It is a banana. Banana = pisang. Bananas are long and yellow.',{img:'banana',c:'Look at the picture!'});
pg(2,`What fruit does Dito's sister like?`,['oranges','grapes','mangoes','apples'],1,`Dito says, "My sister likes grapes." So the answer is grapes (anggur).`,{c:'Rani: Do you like mangoes, Dito? Dito: Yes, I do. My sister likes grapes. Rani: I like oranges better than mangoes.'});
pg(3,'How much is a kilo of mangoes?',['Rp 3,000','Rp 23,000','Rp 40,000','Rp 20,000'],3,'The seller says, "The mangoes are 20,000 rupiah a kilo." Rp 3,000 is the price of the spinach.',{c:'Seller: Good morning. May I help you? Mrs. Sari: Yes, please. I want two kilos of mangoes and one bunch of spinach. Seller: Here you are. The mangoes are 20,000 rupiah a kilo, and the spinach is 3,000 rupiah.'});
pg(4,'What fruit is it?',['mango','grapes','banana','apple'],0,'Yellow, sweet, juicy, with a big seed inside: it is a mango (mangga).',{c:'Read the description! This fruit is yellow when it is ripe. It is sweet and juicy. It has a big seed inside. People make juice and ice cream from it.'});
pg(5,'Tom buys a ________ of bananas. It has seven bananas in it.',['bunch','bottle','glass','slice'],0,'We say a bunch of bananas (satu sisir pisang).');
pg(6,'What is it?',['spinach','banana','potato','carrot'],3,'Orange, long, and crunchy, and rabbits love it: it is a carrot (wortel).',{c:'Read the description! It is orange. Rabbits love to eat it. It is long and crunchy.'});
pg(7,'Which group has only vegetables?',['mango, grapes, apple','spinach, carrot, cabbage','banana, spinach, orange','carrot, mango, spinach'],1,'Spinach (bayam), carrot (wortel), and cabbage (kol) are all vegetables. The other groups have fruits in them.');
pg(8,'What am I?',['mango','carrot','spinach','banana'],2,'Green, with many leaves, and Popeye eats it to be strong: it is spinach (bayam).',{c:'Read the riddle! I am green. I have many leaves. Popeye eats me to be strong.'});
pg(9,'Dad buys a ________ of cooking oil at the shop.',['bunch','piece','slice','bottle'],3,'Oil is a liquid, so we say a bottle of cooking oil.');
pg(10,'What measurement does the man use?',['piece','bunch','kilo','bottle'],2,'The man says, "Half a kilo, please." The measurement is kilo.',{c:'Seller: What do you want to buy, Sir? Man: I need some grapes. Seller: How much do you need? Man: Half a kilo, please.'});
pg(11,'What do we do after cutting the fruits?',['Pour the milk.','Put the pieces into a bowl.','Wash the fruits.','Serve the salad.'],1,'Second, cut the fruits. Third, put the pieces into a bowl. So after cutting, we put the pieces into a bowl.',{c:'Read the text for numbers 11 to 14! '+SALAD});
pg(12,'How long do we keep the salad in the fridge?',['for one hour','for five minutes','for twenty minutes','for ten minutes'],3,'The last step says, "put the salad in the fridge for ten minutes."',{c:SALAD});
pg(13,'Why do we put the salad in the fridge before we serve it?',['To cut it into small pieces.','To make it cold and fresh.','To make it hot.','To wash it.'],1,'A fridge keeps food cold. We want a cold and fresh fruit salad.',{c:SALAD});
pg(14,'Dina wants to make the fruit salad, but she has no sugar. What is the best thing for her to use?',['salt','water','honey','chili sauce'],2,'Honey is sweet like sugar, so it is the best replacement. Salt and chili sauce are not sweet.');
pg(15,'What is the kitchen tool in the picture?',['frying pan','kettle','bowl','spoon'],0,'A flat, round tool with a long handle that we use to fry an egg is a frying pan (wajan).',{img:'pan',c:'Look at the picture!'});
pg(16,'Complete the dialogue! Tina: Excuse me, how can I get to Bara’s house? Man: ________ Then turn left at the bakery.',['Go straight for two blocks.','I am fine, thank you.','He is my friend.','It is a big house.'],0,'Tina asks for directions, so the man gives directions: "Go straight for two blocks."');
pg(17,'Which place is across from the bakery?',['the bank','the school','the library','the park'],3,'On the map, the park is on the other side of Main Street, right opposite the bakery.',{img:'map',c:MAPC});
pg(18,'Where is the bakery?',['It is across from the bank.','It is between the bank and Bara’s house.','It is behind Bara’s house.','It is next to the library.'],1,'The bank is on the left and Bara’s house is on the right of the bakery. So the bakery is between them.',{c:`Read the sentences! The bank is on the left of the bakery. Bara's house is on the right of the bakery.`});
pg(19,'Rina is at the bank. She wants to go to Bara’s house. She walks to the east along Main Street. Which statement is correct?',['She passes the bakery before she gets to Bara’s house.','She passes Bara’s house before the bakery.','She walks to the west.','She turns around at the bakery.'],0,'Going east from the bank, she meets the bakery first and then Bara’s house.',{img:'map',c:MAPC});
pg(20,'Arrange the words into a good sentence! next / is / to / Bara’s house / the bakery',['Next Bara’s house the bakery is to.','The bakery next to is Bara’s house.','Bara’s house is next to the bakery.','Is Bara’s house the bakery next to.'],2,'A good sentence starts with the subject: "Bara’s house is next to the bakery."');

/* ---- Station 2: true / false ---- */
bs(21,'Grapes are more expensive than mangoes.',true,'True. Grapes cost Rp 40,000 a kilo and mangoes cost Rp 20,000 a kilo.',{c:`Mrs. Lia's Fruit Stall. Look at the price list!`,tbl:PRICE});
bs(22,'A kilo of oranges costs Rp 20,000.',false,'False. A kilo of oranges costs Rp 15,000.',{c:'Look at the price list again!',tbl:PRICE});
bs(23,'He has to pay Rp 23,000.',false,'False. 2 kilos of mangoes = Rp 40,000, plus 1 bunch of spinach = Rp 3,000. The total is Rp 43,000.',{c:'Dani buys 2 kilos of mangoes and 1 bunch of spinach. Use the price list!',tbl:PRICE});
bs(24,'We use a knife to cut the fruits.',true,'True. Second, cut the fruits into small pieces with a knife.',{c:'Read the text! '+SALAD});
bs(25,'The last step is to mix everything with a spoon.',false,'False. The last step is to put the salad in the fridge for ten minutes and serve it. Mixing is the step before.',{c:'Read the text again! '+SALAD});

/* ---- Station 3: matching ---- */
mt(26,'Match the sentences from a buying and selling activity with the correct responses!',['May I help you?','How much is it?','Here is your change.'],['It is ten thousand rupiah.','Thank you very much.','Yes, please. I want a kilo of mangoes.','I am from Indonesia.'],[2,0,1],'May I help you? → Yes, please. I want a kilo of mangoes. How much is it? → It is ten thousand rupiah. Here is your change. → Thank you very much.');
mt(27,'Match each activity in the kitchen with the correct tool!',['cut vegetables','boil water','fry an egg'],['frying pan','knife','kettle','refrigerator'],[1,2,0],'We use a knife to cut vegetables, a kettle to boil water, and a frying pan to fry an egg.');
mt(28,'Match each daily activity with the tool we need!',['eating soup','drinking milk','serving fried rice'],['glass','plate','spoon','knife'],[2,0,1],'We use a spoon to eat soup, a glass to drink milk, and a plate to serve fried rice.');
mt(29,'Match each expression of position with the expression that has the same meaning!',['next to','behind','across from'],['opposite','beside','at the back of','between'],[1,2,0],'Next to = beside. Behind = at the back of. Across from = opposite.');
mt(30,'Match each sentence with the correct expression of position!',['The bakery is ________ the bank and Bara’s house.','The library is ________ Bara’s house.','The school is ________ the park.'],['next to','behind','between','across from'],[2,3,0],'The bakery is between the bank and Bara’s house. The library is across from Bara’s house. The school is next to the park.',{img:'map',c:MAPC});

/* ---- Station 4: choose 3 ---- */
pk(31,'Mrs. Sari wants to make vegetable soup for dinner. Choose three ingredients she should buy at the market!',['mangoes','spinach','grapes','carrots','bananas','cabbage'],[1,3,5],'Vegetable soup needs vegetables: spinach, carrots, and cabbage. Mangoes, grapes, and bananas are fruits.');
pk(32,'Choose three important parts of a procedure text!',['A story with many characters','A title that shows the goal','Materials or ingredients','A poem about food','Steps in order','A dialogue between two friends'],[1,2,4],'A procedure text has a title (goal), materials or ingredients, and steps in order.');
pk(33,'Rina is at the bank. She wants to go to Bara’s house. Choose three correct directions!',['Cross the street.','It is next to the bakery.','Go straight to the east.','Go west.','Turn right at the bank.','Pass the bakery.'],[1,2,5],'From the bank, Rina goes straight to the east, passes the bakery, and Bara’s house is next to the bakery.',{img:'map',c:MAPC});
pk(34,'Choose three correct statements about kitchen tools!',['We use a knife to cut vegetables.','We use a kettle to keep ice cream cold.','We use a spoon to stir soup.','We use a plate to boil water.','We use a refrigerator to keep food fresh.','We use a glass to fry eggs.'],[0,2,4],'A knife cuts, a spoon stirs, and a refrigerator keeps food fresh. The other sentences use the wrong tools.');
pk(35,'Choose three sentences that tell the location of a place!',['The bakery is next to Bara’s house.','Bara is a kind boy.','I like eating bread.','The park is across from the bakery.','We go to school every day.','The bank is on the left of the bakery.'],[0,3,5],'Sentences about location use words like next to, across from, and on the left of.');

/* ---- Station 5: fill in the blanks ---- */
fi(36,'I like eating sweet ________.',n=>/\bgrapes?\b/.test(n),'grapes','Grapes (anggur) grow on a vine and are purple.',{img:'grapes',c:'Look at the picture!',hint:'Write one word.'});
fi(37,'My mother makes sauce from red ________.',n=>/\btomato(es)?\b/.test(n),'tomatoes','Round, red vegetables with a green top are tomatoes (tomat).',{img:'tomatoes',c:'Look at the picture!',hint:'Write one word.'});
fi(38,'Write the English word for semangka: ________',n=>/\bwater ?melons?\b/.test(n),'watermelon','Semangka in English is watermelon.',{hint:'Write one word.'});
fi(39,'Mother buys a ________ of tomatoes at the market. It weighs 1,000 grams.',n=>/\b(kilos?|kilograms?|kgs?)\b/.test(n),'kilo','1,000 grams is one kilo (kilogram).',{hint:'Write one word.'});
fi(40,'We keep milk and fruits cold in the ________.',n=>/\b(refrigerator|fridge)\b/.test(n),'refrigerator (fridge)','We keep food cold in the refrigerator, or fridge (kulkas).',{hint:'Write one word.'});
fi(41,'Dina is cutting an onion. She uses a ________.',n=>/\bknife\b/.test(n),'knife','We use a knife to cut things.',{hint:'Write one word.'});
fi(42,'Mother is in the kitchen. She is ________ dinner.',n=>/\b(cooking|making|preparing)\b/.test(n),'cooking','Mother is in the kitchen, so she is cooking dinner.',{hint:'Write one word that ends with -ing.'});
fi(43,'The opposite of left is ________.',n=>/\bright\b/.test(n),'right','Left and right are opposites.',{hint:'Write one word.'});
fi(44,'People go there to borrow and read books. It is a ________.',n=>/\blibrary\b/.test(n),'library','We borrow and read books in a library (perpustakaan).',{hint:'Write one word.'});
fi(45,'The park is ________ the school and the library.',n=>/\bbetween\b/.test(n),'between','On the map, the park is in the middle of the school and the library. So it is between them.',{img:'map',c:MAPC,hint:'Write one word.'});

/* ---- Station 6: essay ---- */
ur(46,'You are at a fruit stall. Write a short dialogue (at least four lines) between you and the seller. You must: greet the seller, say that you want to buy two kilos of oranges and a bunch of spinach, ask about the price, and say thank you.',[['I greeted the seller (Good morning).',1],['I said I want two kilos of oranges and a bunch of spinach.',1],['I asked about the price (or the seller told the price).',1],['I said thank you at the end.',1],['I wrote at least four lines, and the sentences fit the situation.',1]],`Buyer: Good morning. Seller: Good morning. May I help you? Buyer: Yes, please. I want two kilos of oranges and a bunch of spinach. Seller: Here you are. Buyer: How much is it? Seller: It is thirty-three thousand rupiah. Buyer: Here is the money. Thank you.`);
ur(47,'Write five different names of fruits in English.',[['Fruit 1 is correct and spelled correctly.',1],['Fruit 2 is correct and spelled correctly.',1],['Fruit 3 is correct and spelled correctly.',1],['Fruit 4 is correct and spelled correctly.',1],['Fruit 5 is correct and spelled correctly.',1]],'For example: mango, banana, apple, orange, watermelon, grapes, pineapple, papaya, strawberry.');
ur(48,'Read the jumbled instructions about making orange juice! (pour the juice into a glass / cut the oranges in half / wash the oranges / squeeze the oranges) Arrange them into four steps in the correct order. Use the words First, Then, Next, and Finally.',[['First, wash the oranges.',1],['Then, cut the oranges in half.',1],['Next, squeeze the oranges.',1],['Finally, pour the juice into a glass.',1],['I used First, Then, Next, and Finally in the correct places.',1]],'First, wash the oranges. Then, cut the oranges in half. Next, squeeze the oranges. Finally, pour the juice into a glass.');
ur(49,'Write the names of three kitchen tools. Then write one sentence for each tool to tell what we use it for. Use this pattern: We use a ________ to ________.',[['Tool 1 and its use are correct.',1],['Tool 2 and its use are correct.',1],['Tool 3 and its use are correct.',1],['The three tools are different kitchen tools.',1],['I used the pattern We use a ... to ... with correct spelling.',1]],'We use a knife to cut vegetables. We use a spoon to stir soup. We use a frying pan to fry an egg.');
ur(50,'Translate the sentences into Indonesian! The bakery is between the bank and Bara’s house. The park is across from the bakery.',[['The bakery = toko roti.',1],['between the bank and Bara’s house = di antara bank dan rumah Bara.',1],['The park = taman.',1],['across from the bakery = di seberang toko roti.',1],['The whole translation sounds natural and keeps the meaning.',1]],'Toko roti terletak di antara bank dan rumah Bara. Taman berada di seberang toko roti.');

function tone(f,t0,d,type,vol){const c=ac();if(!c)return;try{const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;const t=c.currentTime+t0;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);}catch(e){}}
function sfx(kind){
  if(!state.sound)return;
  if(kind==='win'){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.09,.35,'triangle',.22));tone(1568,.42,.3,'sine',.12);tone(2093,.5,.4,'sine',.09);}
  else if(kind==='hug'){[392,440,523.25].forEach((f,i)=>tone(f,i*.2,.6,'sine',.2));tone(659.25,.62,.7,'sine',.12);}
  else if(kind==='click'){tone(660,0,.08,'sine',.12);}
  else if(kind==='fanfare'){[523.25,659.25,783.99,1046.5,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,i*.14,.4,'triangle',.22));}
  else if(kind==='stage'){[587.33,739.99,880].forEach((f,i)=>tone(f,i*.1,.3,'triangle',.18));}
  else if(kind==='cheer'){[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,i*.11,.4,'triangle',.22));[784,1046.5,1568].forEach((f,i)=>tone(f,.62+i*.1,.45,'sine',.14));}
  else if(kind==='hello'){[392,523.25,659.25,783.99].forEach((f,i)=>tone(f,i*.12,.3,'triangle',.2));}
}

const cv=document.getElementById('fx'),cx=cv.getContext('2d');let parts=[],raf=0;
function fit(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
addEventListener('resize',fit);fit();
function burst(kind){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const n=reduce?0:(kind==='big'?220:kind==='win'?110:18);
  for(let i=0;i<n;i++){
    if(kind==='hug'){parts.push({k:'star',x:Math.random()*innerWidth,y:innerHeight+10,vx:(Math.random()-.5)*.8,vy:-(1.2+Math.random()*1.6),g:-0.004,r:8+Math.random()*8,a:1,rot:Math.random()*6,life:150});}
    else{const c=['#6D4AFF','#FFC933','#FF6B5E','#3FAE49','#FFFFFF'][Math.floor(Math.random()*5)];const ox=kind==='big'?Math.random()*innerWidth:innerWidth/2;parts.push({k:'sq',c,x:ox,y:kind==='big'?-10:innerHeight*.35,vx:(Math.random()-.5)*(kind==='big'?4:11),vy:kind==='big'?Math.random()*3:-(4+Math.random()*8),g:.28,r:5+Math.random()*6,a:1,rot:Math.random()*6,vr:(Math.random()-.5)*.3,life:kind==='big'?200:100});}
  }
  if(!raf)raf=requestAnimationFrame(loop);
}
function star(x,y,r,rot){cx.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5,rr=i%2?r*.45:r;cx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}cx.closePath();cx.fill();}
function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.life--;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr||.03;p.a=Math.min(1,p.life/40);cx.globalAlpha=p.a;
    if(p.k==='star'){cx.fillStyle='#FFC933';star(p.x,p.y,p.r,p.rot);}else{cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillRect(-p.r/2,-p.r/3,p.r,p.r*.66);cx.restore();}}
  cx.globalAlpha=1;
  raf=parts.length?requestAnimationFrame(loop):0;
}

function bodyChoice(q,box){
  const isBs=q.t==='bs';
  box.innerHTML=`<div class="opts ${isBs?'bs':''}">${q.o.map((t,i)=>`<button class="opt" type="button" data-i="${i}"><span class="l">${isBs?(i===0?'✓':'✗'):L[i]}</span><span class="t">${M(t)}</span></button>`).join('')}</div>`;

  bt.forEach(b=>b.onclick=()=>{

    bt[q.k].classList.add('ok');if(i!==q.k)b.classList.add('no');
    resolve(q,i===q.k?1:0,'');
  });
}

function bodyMatch(q,box){
  const sel=new Array(q.rows.length).fill(-1);let act=0;let checked=false;
  function draw(){
    box.innerHTML=`<p class="hint">Ketuk baris di kiri, lalu ketuk hasil yang cocok.</p>
    <div class="rows">${q.rows.map((r,i)=>`<div class="mrow"><div class="mleft">${i+1}. ${M(r)}</div><button type="button" class="mslot ${checked?(sel[i]===q.key[i]?'ok':'no'):(sel[i]>=0?'fill':'')} ${(!checked&&act===i)?'act':''}" data-r="${i}" ${checked?'disabled':''}>${sel[i]>=0?M(q.ch[sel[i]]):'(pilih jawaban)'}${checked?(sel[i]===q.key[i]?' ✓':' ✗'):''}</button></div>`).join('')}</div>
    <div class="chips">${q.ch.map((c,i)=>`<button type="button" class="chip" data-c="${i}" ${(checked||sel.includes(i))?'disabled':''}><b>${L[i]}</b><span>${M(c)}</span></button>`).join('')}</div>

    box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ac();sfx('click');sel[act]=+b.dataset.c;const nx=sel.findIndex(v=>v<0);act=nx<0?act:nx;draw();});

/* ===================== UMPAN BALIK ===================== */
function resolve(q,score,detail){
  if(state.answered)return;state.answered=true;
  state.res[q.n]={s:score,m:q.max};header();
  const full=score===q.max,part=score>0&&!full;
  const line=full?pick(PUJI):(part?pick(SEBAGIAN):pick(SEMANGAT));
  const title=full?(q.max>1?'Perfect, '+who()+'!':'Correct, '+who()+'!'):(part?'Almost, '+who()+'!':'Keep going, '+who()+'!');
  sfx(full?'win':'hug');burst(full?'win':'hug');say(line);
  const last=state.idx===state.list.length-1;
  $('#fb').innerHTML=`<div class="fb ${full?'':'hug'}" role="status">
    ${mascot(full?'happy':'hug',92)}
    <div class="bubble"><h3>${esc(title)}</h3><p>${esc(line)}</p><span class="chipscore">+${score} dari ${q.max} poin</span></div>
    <div class="exp">${detail?detail+'<br>':''}<b>Pembahasan:</b> ${M(q.e||'')}</div>
    <button class="btn btn-gold" id="nx" type="button">${last?'Lihat hasilku':'Lanjut'}</button></div>`;
  const nx=$('#nx');nx.onclick=()=>{sfx('click');try{speechSynthesis.cancel()}catch(e){}if(last)results();else{state.idx++;show();}};
  setTimeout(()=>{const f=$('#fb');if(f)f.scrollIntoView({behavior:'smooth',block:'nearest'});nx.focus({preventScroll:true});},60);
}

/* ===================== HASIL ===================== */
function results(){
  const tot=total(),got=earned();const pct=Math.round(got/tot*100);
  const grade=pct>=90?['English Champion','Luar biasa! Kamu menguasai hampir semuanya.']:pct>=75?['Super Star','Bagus sekali! Sedikit lagi menuju juara.']:pct>=60?['Smart Explorer','Kamu sudah baik. Ayo ulangi pos yang belum sempurna.']:['Calon Juara','Jangan menyerah! Belajar lagi, lalu coba kembali ya.'];
  const stages=[...new Set(state.list.map(q=>q.st))];
  const bars=stages.map(id=>{const qs=state.list.filter(q=>q.st===id);const m=qs.reduce((a,q)=>a+q.max,0);const s=qs.reduce((a,q)=>a+(state.res[q.n]?state.res[q.n].s:0),0);return `<div class="bar"><span>${STAGES[id].pos}: ${STAGES[id].name}</span><span>${s} / ${m}</span><i><b data-w="${Math.round(s/m*100)}"></b></i></div>`;}).join('');
  const stars=pct>=90?3:pct>=75?2:1;
  const medal=`<svg width="120" height="130" viewBox="0 0 120 130" role="img" aria-label="Medali ${grade[0]}"><path d="M34 0 L58 50 L40 54 L16 6Z" fill="#4527C9"/><path d="M86 0 L62 50 L80 54 L104 6Z" fill="#FF6B5E"/><circle cx="60" cy="82" r="40" fill="#FFC933" stroke="#C98F00" stroke-width="5"/><circle cx="60" cy="82" r="30" fill="none" stroke="#FFF0B8" stroke-width="3" stroke-dasharray="3 5"/><path d="M60 62 L66 77 L82 78 L70 88 L74 104 L60 95 L46 104 L50 88 L38 78 L54 77Z" fill="#6D4AFF"/></svg>`;
  const sm=Array.from({length:3},(_,i)=>`<svg width="30" height="30" viewBox="0 0 40 40" style="margin:0 3px;opacity:${i<stars?1:.25}"><path d="M20 3 L25 15 L38 16 L28 25 L31 38 L20 31 L9 38 L12 25 L2 16 L15 15Z" fill="#FFC933"/></svg>`).join('');
  scrollTop();
  app.innerHTML=`<section class="card res"><div class="row" style="justify-content:center;gap:6px">${medal}${mascot('happy',110)}</div>
    <h2 style="margin-top:6px">${esc(grade[0])}, ${esc(who())}!</h2><div>${sm}</div>
    <p>${esc(grade[1])}</p>
    <div class="big"><span id="cnt">0</span><small> / ${tot}</small></div>
    <div class="bars">${bars}</div>
    <div class="row" style="justify-content:center"><button class="btn btn-gold" id="again" type="button">Main lagi</button><button class="btn btn-line" id="menu" type="button">Pilih pos latihan</button></div></section>`;
  const line=pct>=60?'Congratulations, '+who()+'! Your score is '+got+'. You are great!':'Thank you for trying, '+who()+'. Your score is '+got+'. Let us study again. You can do it!';
  sfx(pct>=60?'fanfare':'hug');burst(pct>=60?'big':'hug');say(line);
  let n=0;const el=$('#cnt');const iv=setInterval(()=>{n=Math.min(got,n+Math.max(1,Math.round(got/40)));el.textContent=n;if(n>=got)clearInterval(iv);},30);
  setTimeout(()=>app.querySelectorAll('[data-w]').forEach(b=>b.style.width=b.dataset.w+'%'),80);
  $('#again').onclick=()=>{ac();sfx('click');start(state.mode);};
  $('#menu').onclick=()=>{sfx('click');home();};
}

/* ===================== KONTROL SUARA ===================== */
$('#tSound').onclick=function(){state.sound=!state.sound;this.setAttribute('aria-pressed',state.sound);this.textContent='Efek suara: '+(state.sound?'nyala':'mati');ac();if(state.sound)sfx('click');};
$('#tVoice').onclick=function(){state.voice=!state.voice;this.setAttribute('aria-pressed',state.voice);this.textContent='Suara ucapan: '+(state.voice?'nyala':'mati');if(!state.voice){try{speechSynthesis.cancel()}catch(e){}}else say('Voice is on.',100);};
try{if('speechSynthesis' in window)speechSynthesis.getVoices();}catch(e){}
splash();
</script>
